# Vision Wize · Fase 1 en Render: base de datos, API y web.
# La web llama a la API por la red privada (puente /api/v1), así que ninguna
# necesita conocer de antemano la dirección pública de la otra.
databases:
  - name: visionwize-db
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "17"
    databaseName: visionwize
    user: visionwize

services:
  - type: web
    name: visionwize-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    rootDir: api
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    autoDeployTrigger: "off" # se despliega a mano hasta que la rama sea main
    numInstances: 1 # el reloj de los mensajes no admite más de una
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visionwize-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: none
      - key: SHOP_TZ
        value: America/New_York
      - key: SESSION_TTL_HOURS
        value: "12"
      # PUBLIC_API_URL no hace falta: la API usa la dirección que le da Render.
      # Las claves de correo y SMS se ponen después en el panel de Render
      # (Environment); sin ellas los mensajes quedan en modo prueba:
      # RESEND_API_KEY, EMAIL_FROM, RESEND_WEBHOOK_SECRET,
      # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM

  - type: web
    name: visionwize-web
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    rootDir: web
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /login
    autoDeployTrigger: "off"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: API_HOSTPORT
        fromService:
          type: web
          name: visionwize-api
          property: hostport
